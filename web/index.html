<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Local GitHub Repository Control Plane powered by Actix Web and Personal Access Token authentication."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GitHub Manager — Repository Control Plane</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('ghm-theme') || 'system';
          var resolved =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (_e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
