[package]
name = "github-manager"
version = "0.1.0"
edition = "2021"
description = "Local Actix Web control plane for managing GitHub repositories with a Personal Access Token"
license = "MIT"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
# `rustls-tls` bundles the Mozilla root store; `rustls-tls-native-roots` additionally
# trusts the OS certificate store, which is what corporate proxies, VPN clients and
# antivirus TLS inspection use. Without the second feature those middleboxes make
# every request fail with "error sending request for url (...)".
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "charset", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
base64 = "0.22"
